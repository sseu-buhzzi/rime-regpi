#
# WARNING: This vendored copy may be outdated.
# The source of truth is the flake output (`nix build .#schema`).
#

__patch:
- grammar:/hant?
- reg_pinhinh.custom:/patch?
custom_phrase:
  db_class: stabledb
  dictionary: ''
  enable_completion: false
  enable_sentence: false
  initial_quality: 1
  user_dict: custom_phrase
engine:
  filters:
  - simplifier
  - uniquifier
  processors:
  - ascii_composer
  - recognizer
  - key_binder
  - speller
  - punctuator
  - selector
  - navigator
  - express_editor
  segmentors:
  - ascii_segmentor
  - matcher
  - abc_segmentor
  - punct_segmentor
  - fallback_segmentor
  translators:
  - punct_translator
  - table_translator@custom_phrase
  - reverse_lookup_translator
  - script_translator
key_binder:
  import_preset: default
punctuator:
  import_preset: symbols
recognizer:
  import_preset: default
  patterns:
    punct: ^/([0-9]0?|[A-Za-z]+)$
    reverse_lookup: "`[a-z]*'?$"
reverse_lookup:
  dictionary: stroke
  enable_completion: true
  preedit_format:
  - xlit/hspnz/一丨丿丶乙/
  prefix: '`'
  suffix: "'"
  tips: 〔筆畫〕
schema:
  author:
  - pinh-inh
  dependencies:
  - stroke
  description: 正則拼音（reg_pinhinh）Rime 輸入方案。
  name: 正則拼音
  schema_id: reg_pinhinh
  version: '0.1'
speller:
  algebra:
    __patch:
    - pinyin:/abbreviation
    - pinyin:/spelling_correction
    - pinyin:/key_correction
    - toneless
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: "'"
switches:
- name: ascii_mode
  reset: 0
  states:
  - 中文
  - 西文
- name: full_shape
  states:
  - 半角
  - 全角
- name: simplification
  states:
  - 漢字
  - 汉字
- name: ascii_punct
  states:
  - 。，
  - ．，
toneless:
  __append:
  - derive/^([a-z]+)[hxqs]$/$1/
translator:
  dictionary: reg_pinhinh
  enable_completion: true
  enable_sentence: true
  initial_quality: 1
